org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# ============================================================================
# Gradle 性能优化配置
# ============================================================================
# 启用 Gradle 构建缓存（加快增量构建）
org.gradle.caching=true

# 启用并行构建（同时编译多个模块）
org.gradle.parallel=true

# 启用 Gradle Daemon（避免每次重启 JVM）
org.gradle.daemon=true

# 启用配置缓存（Gradle 6.6+，大幅加快配置阶段）
# 注意：配置缓存与 Flutter/Kotlin 插件不兼容，暂时禁用
# org.gradle.configuration-cache=true

# 按需配置（只配置需要的项目）
org.gradle.configureondemand=true

# ============================================================================
# Android 编译优化
# ============================================================================
# 启用 R8 代码优化器（更快的混淆和优化）
android.enableR8=true
android.enableR8.fullMode=false

# 启用增量 Dex（加快 dex 文件生成）
android.enableIncrementalDesugaring=true

# 启用并行 GC（减少内存压力）
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# ============================================================================
# Kotlin 编译优化
# ============================================================================
# 启用 Kotlin 增量编译
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.incremental.js.ir=true

# 启用 Kotlin 编译缓存
kotlin.compiler.execution.strategy=in-process
